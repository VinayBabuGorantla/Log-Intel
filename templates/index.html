<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogGenie - Upload Log Files</title>
</head>
<body>
    <h2>Upload Log or ZIP File</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li style="color: {% if category == 'error' %}red{% else %}green{% endif %};">
                {{ message }}
            </li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('upload_log') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".log,.txt,.json,.xml,.zip" required>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
